{% extends "base.html" %}

{% block title %}Internal Server Error - 500{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
  <div style="font-size: 64px; margin-bottom: 16px;">⚠️</div>
  <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 10px;">500 - Internal Server Error</h1>
  <p style="color: var(--text-muted); max-width: 480px; margin-bottom: 24px;">
    An unexpected error occurred while processing your request. All activities have been safely logged.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
